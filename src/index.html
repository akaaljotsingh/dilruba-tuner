<!doctype html>
<html lang="en" data-theme="charcoal">
  <head>
    <meta charset="utf-8" />
    <title>Dilruba Sur Tuner</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta name="application-name" content="Sur Tuner" />
    <meta name="mobile-web-app-capable" content="yes" />

  <body>
    <app-root>
      <div class="boot-splash" role="status" aria-label="Loading Dilruba Sur Tuner">
        <svg viewBox="0 0 64 64" aria-hidden="true">

            d="M32 9 C 29.5 22, 34.5 42, 32 55"

            stroke-linecap="round"
          />
